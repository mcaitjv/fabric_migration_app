id: template2
name: template2
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://localhost:5174
      - http://127.0.0.1:5174
      - https://brave-bluff-c8c59a85d0-northeurope.webapp.fabricapps.net
    customClaims:
      app_version: 1.0.0
    scopes:
      - read:data
      - write:data
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: false
